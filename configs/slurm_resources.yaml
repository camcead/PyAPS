# The ONE table of the SLURM resources (CPUs, memory, time limit) of every PyAPS job.
# Read by py/PyAPS/aps_slurm_resources.py; used by aps_runner.py for every sbatch line.
# Operator guide: doc/SLURM_RESOURCES.md.   Show a row:  python -m PyAPS.aps_slurm_resources explain --family MOS --res HR --stack single
#
# Profiles
#   default   what the runner did before this table existed, value for value (the CPU counts the DMS passed as --mp_MOS 8,12,18,10,20,6,1
#             / --mp_LIFU 6,30,20 / --mp_MIFU 3,10,10 / --mp_CS 6,12,6,12,12,1,1, the HR doubling, FERRE halved for single exposures,
#             the memory of FERRE / IFU_ExGal / FESWI, 48 h for every L2 stage). Nothing else has a memory request, so SLURM gives
#             those jobs DefMemPerCPU x cpus.
#   v2        allocations from the measurements of 2026-11 (see doc/SLURM_RESOURCES.md, section "Measured allocation").
#   v2_openmp v2 for a site whose ferre.x is built with OpenMP.      laptop   v2 with CPU counts for a small machine (4-8 cores).
#   site      (not a profile: a word) `slurm_profile: site` / `--slurm_profile site` takes the profile named by the detected site (section `sites`).
# Choose one: script_params key  slurm_profile: 'v2'   (or env PYAPS_SLURM_PROFILE, or aps_runner.py --slurm_profile v2).
#
# Row keys (stage rows):  cpus  mem_gb  time  status  note  cases
#   cpus   CPUs of the job = sbatch --ntasks = the stage's --mp (every stage pins BLAS/OpenMP to one thread, so one process per CPU)
#   mem_gb sbatch --mem in GB (1024 MB); null = no request (SLURM default per CPU)
#   time   sbatch --time; null = no limit
#   status legacy (the value that was in the code) | measured (set from the audit) | unmeasured (copied, nobody has measured it)
#   cases  rules applied in order to this stage, then the family's `common` rules; see the module docstring
# Conditions:  res: LR|HR   stack: single|stack|super|other   grid: m|n (FERRE grid prefix of the run)

schema: 1
default_profile: default
# what SLURM gives a job without --mem, in GB per CPU (slurm.conf DefMemPerCPU = 1024); used to scale it after an out-of-memory
assumed_default_mem_gb_per_cpu: 1

# MACHINE AND SITE AWARENESS (doc/SLURM_RESOURCES.md, section 9). Before a request is checked the runner looks at the place the jobs will
# run (PyAPS.aps_resource_probe): a SLURM cluster (nodes, RealMemory, MaxTime, ...) or this machine (CPUs honouring affinity and cgroup limits,
# RAM, swap). The place is named a `site` for the report. The checks are policy `limits:` off | warn | clamp | error (see the profiles); a
# request that fits is never changed, whatever the policy.
#
# A site entry (all keys optional):
#   match:         when the site is not named, the entry that matches best is the detected one. Keys (all must hold): scheduler (slurm|none),
#                  kind (slurm|laptop|workstation|container), hostname (regex), cluster (SLURM ClusterName regex), any_node ({cpus, real_memory_mb}:
#                  a node of the cluster has these), node_names (regex).
#   profile:       what `slurm_profile: site` takes;  profile_openmp: the same when ferre.x is built with OpenMP (probed from the file)
#   ferre_openmp:  true|false  what the site is expected to have (used when ferre.x cannot be read)
#   limits:        default policy of the site (below --slurm_limits / PYAPS_SLURM_LIMITS / slurm_limits, above the profile's)
#   mem_fraction, cpu_fraction:  share of the available RAM / of the usable CPUs a run on this machine may take (machines without SLURM)
#   expect:        {nodes, node_cpus, node_mem_gb, cpus, mem_gb}: what the site should look like; a difference is reported, nothing else
#   max_mem_gb, max_cpus, max_time:  PIN the limits of ONE node (then SLURM is not asked); only for a site that is named explicitly
# Sites of one installation (names, hostnames, node sizes) are not listed here (this file is public): put them in `slurm_sites.yaml` next to the
# script_params (PyAPS_CONFIG), or name the file with PYAPS_SLURM_SITES_FILE / the script_params key slurm_sites_file. Same keys, under `sites:`.
sites:
  local:
    description: "A machine without a scheduler: laptop, workstation, shared host, a pod or container without SLURM, or a bash run (--hpc 1)"
    match: {scheduler: none}
    profile: laptop
    limits: clamp                # nothing enforces a request here: fit it to the machine, loudly
    mem_fraction: 0.8            # never plan for more than 80 % of the RAM that is available now
    cpu_fraction: 0.75           # leave a quarter of the CPUs to the rest of the machine
  slurm:
    description: "Any SLURM cluster that is not listed in slurm_sites.yaml: the profile follows the ferre.x build"
    match: {scheduler: slurm}
    profile: v2
    profile_openmp: v2_openmp

# Estimated true footprint (PSS, GB) of a stage = base_gb + per_cpu_gb x CPUs, from the dev rehearsal of 2026-11-05 (the worst measured case).
# Used where the `mem_gb` of a row is not a limit anyone enforces (a bash run on a machine without SLURM): the stage then runs with as many
# workers as the RAM allows. Stages without an entry are checked with their `mem_gb`.
footprint:
  RR:        {base_gb: 2,  per_cpu_gb: 1.0, note: "PSS 7-10 GB with 8 workers, 17 GB with 16"}
  RVS:       {base_gb: 1,  per_cpu_gb: 4.0, note: "PSS 21-45 GB with 12 workers (1.7-3.8 GB each), 54-97 GB with 24: grows with the workers"}
  FR:
    base_gb: 3
    per_cpu_gb: 0
    note: "one ferre.x per grid: 0.6-3 GB with the coarse grids"
    cases:
      - {when: {grid: m, res: LR}, base_gb: 55, note: "fine grids (stack products): PSS 51.5 GB (file-backed grid pages)"}
      - {when: {grid: m, res: HR}, base_gb: 85, note: "fine grids, HR: PSS 82 GB so far"}
  PPXF:      {base_gb: 1,  per_cpu_gb: 0.6, note: "PSS 4-7 GB with 10 workers"}
  EMI:       {base_gb: 1.5, per_cpu_gb: 0.5, note: "PSS 3-5 GB with 6 workers, 11 GB with 20"}
  LS:        {base_gb: 3.5, per_cpu_gb: 0, note: "PSS 1-2.4 GB, 3.5 GB at most"}
  L2merge:   {base_gb: 6,  per_cpu_gb: 0, note: "a 41 s peak: MaxRSS 5.6 GB on a HR OB"}
  IFU_PR:    {base_gb: 17, per_cpu_gb: 0, note: "PSS 13-17 GB, 27 GB for a heavy HR cube"}
  IFU_ExGal: {base_gb: 4,  per_cpu_gb: 0.4, note: "PSS 14-18 GB with up to 40 workers"}
  IFU_Gal:   {base_gb: 4,  per_cpu_gb: 8.0, note: "PSS 5-6 GB with 2 workers, 36 GB with 4 (OB dependent): grows with the workers"}

# Depth-first order of the jobs (doc/SLURM_RESOURCES.md, section 10). The queue of the pods is FIFO by the time a job became ELIGIBLE (only the
# age counts), so the first stages of every later pair pass the last stages of the first pair, and a night ends with many half-finished chains.
# With policy depth_first every job gets `--nice` = class base + stage_step x (stages still to come after it) + pair_step x min(pair index,
# pair_cap): the first pair and the last stages get the smallest value, nothing gets a negative one (a normal user cannot). Nice only delays a job
# against jobs that became eligible less than nice/417 h earlier (the age term is 417 points an hour, capped at 10000): nothing starves.
# classes: `offline` (aps-offline, an answer wanted now) is always ahead of `scheduled` (the daemon): the largest nice of an offline job (3200 +
# 800 = 4000) is below the smallest of a scheduled one (4500). The largest sum (8500) stays below the age cap of 10000.
priority:
  policy: "off"                # off | depth_first (a profile may say otherwise; --slurm_priority / PYAPS_SLURM_PRIORITY / slurm_priority win)
  default_class: scheduled
  classes: {offline: 0, scheduled: 4500}
  stage_step: 800
  pair_step: 100
  pair_cap: 8
  stage_remaining:             # stages that still have to run after this one in its chain
    RR: 4
    RVS: 3
    PPXF: 3
    FR: 2
    EMI: 2
    LS: 1
    L2merge: 0
    IFU_PR: 1
    IFU_ExGal: 0
    IFU_Gal: 0
    SQ: 0
    FESWI: 0
    SPACE: 0
    AMY: 0
    AN: 0
    RRLGV: 0
    RRLEW: 0

profiles:

  default:
    description: "Exactly the values the code had before the table (golden-tested against PyAPS 2.0)."
    limits: warn                 # off | warn (print, never change) | clamp (lower only what does not fit) | error (refuse what can never run)

    MOS:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles (the base values are for LR; aps_runner 14 June 2024)"
      stages:
        RR:      {cpus: 8,  time: "2-00:00:00", status: legacy}
        RVS:     {cpus: 12, time: "2-00:00:00", status: legacy}
        FR:
          cpus: 18
          time: "2-00:00:00"
          status: legacy
          cases:
            - when: {stack: single}
              cpus: {half_plus_one: true}
              note: "single exposure: half the CPUs plus one (halved before the HR doubling)"
            - when: {grid: m, res: HR}
              mem_gb: 380
              note: "fine FERRE grids, HR"
            - when: {grid: m, res: LR}
              mem_gb: 190
              note: "fine FERRE grids, LR"
        PPXF:    {cpus: 10, time: "2-00:00:00", status: legacy}
        EMI:     {cpus: 20, time: "2-00:00:00", status: legacy}
        LS:      {cpus: 6,  time: "2-00:00:00", status: legacy}
        L2merge: {cpus: 1,  time: "2-00:00:00", status: legacy}

    LIFU:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles"
      stages:
        IFU_PR:    {cpus: 6,  time: "2-00:00:00", status: legacy}
        IFU_ExGal: {cpus: 30, mem_gb: 240, time: "2-00:00:00", status: legacy}
        IFU_Gal:   {cpus: 20, time: "2-00:00:00", status: legacy}

    MIFU:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles"
      stages:
        IFU_PR:    {cpus: 3,  time: "2-00:00:00", status: legacy}
        IFU_ExGal: {cpus: 10, time: "2-00:00:00", status: legacy}     # mini IFU: smaller field, no memory request (was '')
        IFU_Gal:   {cpus: 10, time: "2-00:00:00", status: legacy}

    CS:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles"
      stages:
        SQ:    {cpus: 6,  status: legacy}          # the CS stages have never had a time limit
        FESWI:
          cpus: 12
          status: legacy
          cases:
            - when: {grid: m}
              mem_gb: 400
              note: "fine FERRE grids"
        SPACE: {cpus: 6,  status: legacy}
        AMY:   {cpus: 12, status: legacy}
        AN:    {cpus: 12, status: legacy}
        RRLGV: {cpus: 1,  status: legacy}
        RRLEW: {cpus: 1,  status: legacy}

  v2:
    description: >
      Allocation from the SLURM audit of 2026-11-04 and the rehearsal on a development site (see doc/SLURM_RESOURCES.md, section 7).
      CPUs: the busy cores of the stages measured without the plot images, capped by what each stage can use; time limits: about 2 x the
      longest completed run of the class, because the limit only has to catch a hung job; memory: the true footprint (PSS: shared pages
      counted once) with a margin, NOT the sum of the RSS of the worker processes (which counts shared pages once per process and
      overstates it 3-10 x). The memory column is a scheduling token until the cluster enforces it through cgroups; with enforcement it is
      the kill limit, so it must stay above the true peak. No "HR doubles everything" rule. Rows without any measurement (mini IFU, CS)
      hold the old values and say so in `status`.
    extends: default
    limits: clamp                # a request above the largest node is lowered to it (and printed)
    priority: {policy: depth_first}

    MOS:
      common: []
      stages:
        RR:
          cpus: 8
          mem_gb: 24
          time: "0-06:00:00"
          status: measured
          note: "LR: 6.5-6.8 busy cores of 8, 14-23 min without plot images. HR: with 16 CPUs 11.75 cores busy and 19 min, with 8 CPUs 5.5 cores and 38 min (same core-hours, half the wall time), so HR keeps its 16; a HR OB with few fibres does not use them (5 vs 4 min). PSS peak 7-10 GB LR, 17 GB HR; longest run 226 min with plot images"
          cases:
            - {when: {res: HR}, cpus: {set: 16}, mem_gb: 36}
        RVS:
          cpus: 12
          mem_gb: 72
          time: "0-03:00:00"
          status: measured
          note: "pool of --mp workers; PSS peak 21-45 GB single, 59 GB stack (plots off), 77 GB HR with Chrome"
          cases:
            - {when: {res: HR}, cpus: {set: 24}, mem_gb: 144}
        FR:
          cpus: 9
          mem_gb: 8
          time: "1-06:00:00"
          status: measured
          note: "one ferre.x per grid, 9 grids: at most 9 cores can be busy on a single-thread build (6.3 measured); PSS 0.6-3 GB; run 1121 min longest completed on the single-thread build. An OpenMP ferre.x can use more: profile v2_openmp"
          cases:
            - {when: {grid: m, res: LR}, mem_gb: 80, time: {set: "2-00:00:00"}, note: "fine grids (stack products): PSS peak 51.5 GB (OB 25771, dev rehearsal; the grids are file-backed pages), run up to 1988 min on the single-thread build"}
            - {when: {grid: m, res: HR}, mem_gb: 160, time: {set: "2-00:00:00"}, note: "fine grids, HR: PSS 82 GB so far in the one dev job that was still running at the cut-off (OB 19569); the one production job timed out at 8 h"}
        PPXF:
          cpus: 10
          mem_gb: 16
          time: "0-06:00:00"
          status: measured
          note: "busy cores p90 8.6 (LR) / 10.4 (HR), max 11; PSS peak 4-7 GB; longest run 205 min with plots"
        EMI:
          cpus: 6
          mem_gb: 28
          time: "0-04:00:00"
          status: measured
          note: "busy cores max 5.9; PSS peak 11 GB (LR); longest run 111 min with plots"
          cases:
            - {when: {res: HR}, mem_gb: 40}
        LS:
          cpus: 2
          mem_gb: 6
          time: "0-00:30:00"
          status: measured
          note: "uses 0.5-1 core, 1-3 minutes; PSS peak 1-2.4 GB here, 3.5 GB at most on the audit's runs"
        L2merge:
          cpus: 1
          mem_gb: 8
          time: "0-00:15:00"
          status: measured
          note: "0.3-0.5 core, under 1 minute. A 41 s peak the 10 s PSS samples missed: under cgroup enforcement a HR job (OB 24061) was killed at 4 GB and 6 GB (OUT_OF_MEMORY) and passed at 8 GB with a MaxRSS of 5.6 GB; the LR job (OB 21622) passed at 4 GB (MaxRSS 3.3 GB)"
          cases:
            - {when: {res: HR}, mem_gb: 12}

    LIFU:
      common: []
      stages:
        IFU_PR:
          cpus: 3
          mem_gb: 24
          time: "0-06:00:00"
          status: measured
          note: "1.1-2.1 cores; PSS peak 13-17 GB LR, 27 GB HR; longest run 131 min"
          cases:
            - {when: {res: HR}, mem_gb: 36}
        IFU_ExGal:
          cpus: 40
          mem_gb: 80
          time: "0-10:00:00"
          status: measured
          note: "busy cores p90 33 (LR) with max 42, run 374 min longest, same in HR (no doubling: 60 cores were asked and 3.7 used); PSS peak 17-20 GB with Chrome, MaxRSS-sum 164-237 GB is a multiple count"
          cases:
            - {when: {res: HR}, mem_gb: 128}
        IFU_Gal:
          cpus: 4
          mem_gb: 48
          time: "0-16:00:00"
          status: measured
          note: "serial on the single-thread ferre.x of the production pod (1.0-1.3 busy cores p50/p90, 4.3 at most, 91 jobs); on the OpenMP ferre.x of the dev pod a small OB used 7 cores for 4 min against 1.8 cores for 12 min with 2 CPUs; run 518 min LR / 696 min HR. PSS peak 36 GB (LR, 20 workers; 6 GB with 2 workers in the dev rehearsal, 5-6 GB for three OBs), 20 GB HR with 40 workers (5 GB with 2): the footprint grows with the workers, so 4 CPUs need less than the 20 or 40 the audit measured"
          cases:
            - {when: {res: HR}, mem_gb: 96, time: {set: "1-00:00:00"}}

    MIFU:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles (old rule, never measured: there is no mini IFU job in the accounting)"
      stages:
        IFU_PR:    {cpus: 3,  mem_gb: 24,  time: "0-06:00:00", status: unmeasured, note: "no mini IFU job has ever run; CPUs from the old values, memory and time from the large IFU"}
        IFU_ExGal: {cpus: 10, mem_gb: 80,  time: "0-10:00:00", status: unmeasured}
        IFU_Gal:   {cpus: 10, mem_gb: 72,  time: "0-16:00:00", status: unmeasured, note: "IFU_Gal is serial on the single-thread build: 2 CPUs would be enough, confirm on the first mini IFU job"}

    CS:
      stages:
        SPACE: {cpus: 1, status: derived, note: "the runner never gives aps_space.py an --mp, so it runs one process whatever is requested"}
        RRLGV: {cpus: 1, status: derived, note: "no worker processes"}
        RRLEW: {cpus: 1, status: derived, note: "no worker processes"}
        FESWI:
          cpus: 12
          status: unmeasured
          note: "no CS job has run on SLURM. The old 400 GB cannot run on a 351 GB node; FESWI reads the same fine FERRE grids as FR, so 128 GB"
          cases:
            - {when: {grid: m}, mem_gb: 128}
        # SQ, AMY, AN: unmeasured (no CS job has run on SLURM); they keep the old values of `default`

  v2_openmp:
    description: >
      v2 for a site whose ferre.x is built with OpenMP: FR asks 18 CPUs, so each of the 9 ferre.x processes runs 2 threads (aps_ferre.py
      sets NTHREADS to cpus // grids). Not measured: the audit saw 17-45 cores used with the OpenMP build when nothing limited it.
    extends: v2
    MOS:
      stages:
        FR:
          cpus: 18
          mem_gb: 8
          time: "1-06:00:00"
          status: unmeasured
          cases:
            - {when: {grid: m, res: LR}, mem_gb: 80, time: {set: "2-00:00:00"}}
            - {when: {grid: m, res: HR}, mem_gb: 160, time: {set: "2-00:00:00"}}

  laptop:
    description: >
      v2 with CPU counts for a machine of 4-8 cores and 16-32 GB (a laptop, a small workstation). The memory column is the SLURM token of v2
      (ignored where nothing enforces it: the run is sized from the `footprint` table). Not measured on a laptop; the stage logs say what each
      stage got. Choose it with `--slurm_profile laptop` or `slurm_profile: site`.
    extends: v2
    limits: clamp
    MOS:
      common: []
      stages:
        RR:      {cpus: 4, mem_gb: 24, time: "0-12:00:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 36}]}
        RVS:     {cpus: 4, mem_gb: 72, time: "0-06:00:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 144}]}
        FR:
          cpus: 4
          mem_gb: 8
          time: "2-00:00:00"
          status: unmeasured
          cases:
            - {when: {grid: m, res: LR}, mem_gb: 80}
            - {when: {grid: m, res: HR}, mem_gb: 160}
        PPXF:    {cpus: 4, mem_gb: 16, time: "0-12:00:00", status: unmeasured}
        EMI:     {cpus: 2, mem_gb: 28, time: "0-08:00:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 40}]}
        LS:      {cpus: 1, mem_gb: 6, time: "0-01:00:00", status: unmeasured}
        L2merge: {cpus: 1, mem_gb: 8, time: "0-00:30:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 12}]}
    LIFU:
      common: []
      stages:
        IFU_PR:    {cpus: 2, mem_gb: 24, time: "0-12:00:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 36}]}
        IFU_ExGal: {cpus: 6, mem_gb: 80, time: "1-00:00:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 128}]}
        IFU_Gal:   {cpus: 2, mem_gb: 48, time: "1-12:00:00", status: unmeasured, cases: [{when: {res: HR}, mem_gb: 96}]}
