# The ONE table of the SLURM resources (CPUs, memory, time limit) of every PyAPS job.
# Read by py/PyAPS/aps_slurm_resources.py; used by aps_runner.py for every sbatch line.
# Operator guide: doc/SLURM_RESOURCES.md.   Show a row:  python -m PyAPS.aps_slurm_resources explain --family MOS --res HR --stack single
#
# Profiles
#   default   what the runner did before this table existed, value for value (the CPU counts the DMS passed as --mp_MOS 8,12,18,10,20,6,1
#             / --mp_LIFU 6,30,20 / --mp_MIFU 3,10,10 / --mp_CS 6,12,6,12,12,1,1, the HR doubling, FERRE halved for single exposures,
#             the memory of FERRE / IFU_ExGal / FESWI, 48 h for every L2 stage). Nothing else has a memory request, so SLURM gives
#             those jobs DefMemPerCPU x cpus.
#   v2        allocations from the measurements of 2026-11 (see doc/SLURM_RESOURCES.md, section "Measured allocation").
# Choose one: script_params key  slurm_profile: 'v2'   (or env PYAPS_SLURM_PROFILE, or aps_runner.py --slurm_profile v2).
#
# Row keys (stage rows):  cpus  mem_gb  time  status  note  cases
#   cpus   CPUs of the job = sbatch --ntasks = the stage's --mp (every stage pins BLAS/OpenMP to one thread, so one process per CPU)
#   mem_gb sbatch --mem in GB (1024 MB); null = no request (SLURM default per CPU)
#   time   sbatch --time; null = no limit
#   status legacy (the value that was in the code) | measured (set from the audit) | unmeasured (copied, nobody has measured it)
#   cases  rules applied in order to this stage, then the family's `common` rules; see the module docstring
# Conditions:  res: LR|HR   stack: single|stack|super|other   grid: m|n (FERRE grid prefix of the run)

schema: 1
default_profile: default
# what SLURM gives a job without --mem, in GB per CPU (slurm.conf DefMemPerCPU = 1024); used to scale it after an out-of-memory
assumed_default_mem_gb_per_cpu: 1

# Per-site limits of ONE node (a job runs on one node). They stop a request that no node can ever run. Normally nothing is listed here:
# the limits are read from SLURM (sinfo: the largest node and the partition time limit). To pin them for a site, add an entry and name it
# with the script_params key `slurm_site` (or PYAPS_SLURM_SITE):
#   sites:
#     my_site: {max_mem_gb: 340, max_cpus: 90, max_time: "2-00:00:00", note: "workers of 90 CPUs, 360000 MB"}
sites: {}

profiles:

  default:
    description: "Exactly the values the code had before the table (golden-tested against PyAPS 2.0)."
    limits: warn                 # off | warn (print, never change) | clamp (lower an impossible request to the node limit)

    MOS:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles (the base values are for LR; aps_runner 14 June 2024)"
      stages:
        RR:      {cpus: 8,  time: "2-00:00:00", status: legacy}
        RVS:     {cpus: 12, time: "2-00:00:00", status: legacy}
        FR:
          cpus: 18
          time: "2-00:00:00"
          status: legacy
          cases:
            - when: {stack: single}
              cpus: {half_plus_one: true}
              note: "single exposure: half the CPUs plus one (halved before the HR doubling)"
            - when: {grid: m, res: HR}
              mem_gb: 380
              note: "fine FERRE grids, HR"
            - when: {grid: m, res: LR}
              mem_gb: 190
              note: "fine FERRE grids, LR"
        PPXF:    {cpus: 10, time: "2-00:00:00", status: legacy}
        EMI:     {cpus: 20, time: "2-00:00:00", status: legacy}
        LS:      {cpus: 6,  time: "2-00:00:00", status: legacy}
        L2merge: {cpus: 1,  time: "2-00:00:00", status: legacy}

    LIFU:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles"
      stages:
        IFU_PR:    {cpus: 6,  time: "2-00:00:00", status: legacy}
        IFU_ExGal: {cpus: 30, mem_gb: 240, time: "2-00:00:00", status: legacy}
        IFU_Gal:   {cpus: 20, time: "2-00:00:00", status: legacy}

    MIFU:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles"
      stages:
        IFU_PR:    {cpus: 3,  time: "2-00:00:00", status: legacy}
        IFU_ExGal: {cpus: 10, time: "2-00:00:00", status: legacy}     # mini IFU: smaller field, no memory request (was '')
        IFU_Gal:   {cpus: 10, time: "2-00:00:00", status: legacy}

    CS:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles"
      stages:
        SQ:    {cpus: 6,  status: legacy}          # the CS stages have never had a time limit
        FESWI:
          cpus: 12
          status: legacy
          cases:
            - when: {grid: m}
              mem_gb: 400
              note: "fine FERRE grids"
        SPACE: {cpus: 6,  status: legacy}
        AMY:   {cpus: 12, status: legacy}
        AN:    {cpus: 12, status: legacy}
        RRLGV: {cpus: 1,  status: legacy}
        RRLEW: {cpus: 1,  status: legacy}

  v2:
    description: >
      Allocation from the SLURM audit of 2026-11-04 and the rehearsal on the ARCUS dev pod (see doc/SLURM_RESOURCES.md, section 7).
      CPUs: the busy cores of the stages measured without the plot images, capped by what each stage can use; time limits: about 2 x the
      longest completed run of the class, because the limit only has to catch a hung job; memory: the true footprint (PSS: shared pages
      counted once) with a margin, NOT the sum of the RSS of the worker processes (which counts shared pages once per process and
      overstates it 3-10 x). The memory column is a scheduling token until the cluster enforces it through cgroups; with enforcement it is
      the kill limit, so it must stay above the true peak. No "HR doubles everything" rule. Rows without any measurement (mini IFU, CS)
      hold the old values and say so in `status`.
    extends: default
    limits: clamp                # a request above the largest node is lowered to it (and printed)

    MOS:
      common: []
      stages:
        RR:
          cpus: 8
          mem_gb: 24
          time: "0-06:00:00"
          status: measured
          note: "busy cores 6.5-8 (LR) / 7.7-12 with Chrome (HR: not faster than LR); PSS peak 7-13 GB; longest run 226 min with plots, 15-19 min without"
          cases:
            - {when: {res: HR}, mem_gb: 36}
        RVS:
          cpus: 12
          mem_gb: 72
          time: "0-03:00:00"
          status: measured
          note: "pool of --mp workers; PSS peak 21-45 GB single, 59 GB stack (plots off), 77 GB HR with Chrome"
          cases:
            - {when: {res: HR}, cpus: {set: 24}, mem_gb: 144}
        FR:
          cpus: 9
          mem_gb: 8
          time: "1-06:00:00"
          status: measured
          note: "one ferre.x per grid, 9 grids: at most 9 cores can be busy on a single-thread build (6.3 measured); PSS 0.6-3 GB; run 1121 min longest completed on the single-thread build. An OpenMP ferre.x can use more: profile v2_openmp"
          cases:
            - {when: {grid: m, res: LR}, mem_gb: 64, time: {set: "2-00:00:00"}, note: "fine grids (stack products): run up to 1988 min on the single-thread build"}
            - {when: {grid: m, res: HR}, mem_gb: 128, time: {set: "2-00:00:00"}, note: "fine grids, HR: one job only (TIMEOUT), twice the LR value"}
        PPXF:
          cpus: 10
          mem_gb: 16
          time: "0-06:00:00"
          status: measured
          note: "busy cores p90 8.6 (LR) / 10.4 (HR), max 11; PSS peak 4-7 GB; longest run 205 min with plots"
        EMI:
          cpus: 6
          mem_gb: 28
          time: "0-04:00:00"
          status: measured
          note: "busy cores max 5.9; PSS peak 11 GB (LR); longest run 111 min with plots"
          cases:
            - {when: {res: HR}, mem_gb: 40}
        LS:
          cpus: 2
          mem_gb: 4
          time: "0-00:30:00"
          status: measured
          note: "uses 0.9 core, 1-3 minutes; PSS peak 3.5 GB"
        L2merge:
          cpus: 1
          mem_gb: 4
          time: "0-00:15:00"
          status: measured
          note: "0.3 core, 1 minute, PSS 1.4 GB"

    LIFU:
      common: []
      stages:
        IFU_PR:
          cpus: 3
          mem_gb: 24
          time: "0-06:00:00"
          status: measured
          note: "1.1-2.1 cores; PSS peak 13-17 GB LR, 27 GB HR; longest run 131 min"
          cases:
            - {when: {res: HR}, mem_gb: 36}
        IFU_ExGal:
          cpus: 40
          mem_gb: 80
          time: "0-10:00:00"
          status: measured
          note: "busy cores p90 33 (LR) with max 42, run 374 min longest, same in HR (no doubling: 60 cores were asked and 3.7 used); PSS peak 17-20 GB with Chrome, MaxRSS-sum 164-237 GB is a multiple count"
          cases:
            - {when: {res: HR}, mem_gb: 128}
        IFU_Gal:
          cpus: 2
          mem_gb: 72
          time: "0-16:00:00"
          status: measured
          note: "serial on the single-thread ferre.x (1.0 core in 100 % of the production jobs); run 518 min LR / 696 min HR; PSS peak 36 GB LR"
          cases:
            - {when: {res: HR}, mem_gb: 144, time: {set: "1-00:00:00"}}

    MIFU:
      common:
        - when: {res: HR}
          cpus: {scale: 2}
          note: "HR: every CPU value doubles (old rule, never measured: there is no mini IFU job in the accounting)"
      stages:
        IFU_PR:    {cpus: 3,  mem_gb: 24,  time: "0-06:00:00", status: unmeasured, note: "no mini IFU job has ever run; CPUs from the old values, memory and time from the large IFU"}
        IFU_ExGal: {cpus: 10, mem_gb: 80,  time: "0-10:00:00", status: unmeasured}
        IFU_Gal:   {cpus: 10, mem_gb: 72,  time: "0-16:00:00", status: unmeasured, note: "IFU_Gal is serial on the single-thread build: 2 CPUs would be enough, confirm on the first mini IFU job"}

    CS:
      stages:
        SPACE: {cpus: 1, status: derived, note: "the runner never gives aps_space.py an --mp, so it runs one process whatever is requested"}
        RRLGV: {cpus: 1, status: derived, note: "no worker processes"}
        RRLEW: {cpus: 1, status: derived, note: "no worker processes"}
        FESWI:
          cpus: 12
          status: unmeasured
          note: "no CS job has run on SLURM. The old 400 GB cannot run on a 351 GB node; FESWI reads the same fine FERRE grids as FR, so 128 GB"
          cases:
            - {when: {grid: m}, mem_gb: 128}
        # SQ, AMY, AN: unmeasured (no CS job has run on SLURM); they keep the old values of `default`

  v2_openmp:
    description: >
      v2 for a site whose ferre.x is built with OpenMP: FR asks 18 CPUs, so each of the 9 ferre.x processes runs 2 threads (aps_ferre.py
      sets NTHREADS to cpus // grids). Not measured: the audit saw 17-45 cores used with the OpenMP build when nothing limited it.
    extends: v2
    MOS:
      stages:
        FR:
          cpus: 18
          mem_gb: 8
          time: "1-06:00:00"
          status: unmeasured
          cases:
            - {when: {grid: m, res: LR}, mem_gb: 64, time: {set: "2-00:00:00"}}
            - {when: {grid: m, res: HR}, mem_gb: 128, time: {set: "2-00:00:00"}}

  v2_pss:
    description: >
      v2 with the memory of the stages measured on the dev site by true footprint (PSS: shared pages divided between the processes that map
      them), 1.25 x the largest peak seen: RR 12.6 GB (HR), RVS 72.7 GB (HR) / 36.0 (LR), FR 3.0, PPXF 5.8, IFU_PR 26.6, IFU_ExGal 20.0,
      IFU_Gal 35.7 (a handful of runs each; EMI, LS and L2merge have no measurement and keep the v2 bound). ONLY for a cluster that enforces
      memory through cgroups (task/cgroup): the accounting-plugin enforcement compares the RSS SUM, which is several times larger, and would
      kill these jobs. Without enforcement it just reserves less.
    extends: v2
    MOS:
      stages:
        RR:
          cpus: 8
          mem_gb: 16
          time: "0-06:00:00"
          status: measured
          note: "PSS peak 6.9 GB (LR single, 6 runs), 12.6 GB (HR and the larger OBs); RSS-sum 29-70 GB"
          cases:
            - {when: {res: HR}, mem_gb: 16}
        RVS:
          cpus: 16
          mem_gb: 46
          time: "0-03:00:00"
          status: measured
          note: "PSS peak 36.0 GB LR (13 runs), 72.7 GB HR (1 run); RSS-sum 43 / 87 GB"
          cases:
            - {when: {res: HR}, cpus: {set: 24}, mem_gb: 92}
        FR:
          cpus: 9
          mem_gb: 4
          time: "1-06:00:00"
          status: measured
          note: "PSS peak 3.0 GB (13 runs, grid n); the fine grids (stack products) were not measured: they keep the v2 values"
          cases:
            - {when: {grid: m, res: LR}, mem_gb: 64, time: {set: "2-00:00:00"}}
            - {when: {grid: m, res: HR}, mem_gb: 128, time: {set: "2-00:00:00"}}
        PPXF:
          cpus: 10
          mem_gb: 8
          time: "0-06:00:00"
          status: measured
          note: "PSS peak 5.8 GB (LR, 13 runs), 5.1 GB (HR, 1 run)"
          cases:
            - {when: {res: HR}, mem_gb: 8}
    LIFU:
      stages:
        IFU_PR:
          cpus: 3
          mem_gb: 34
          time: "0-10:00:00"
          status: measured
          note: "PSS peak 16.7 GB LR (2 runs), 26.6 GB HR (3 runs)"
        IFU_ExGal:
          cpus: 40
          mem_gb: 25
          time: "0-10:00:00"
          status: measured
          note: "PSS peak 17.6-20.0 GB (3 runs) against a MaxRSS-sum of 183-237 GB; CPUs and time as in v2"
        IFU_Gal:
          cpus: 2
          mem_gb: 45
          time: "0-16:00:00"
          status: measured
          note: "PSS peak 35.7 GB LR (2 runs), 20.0 GB HR (1 run)"
          cases:
            - {when: {res: HR}, time: {set: "1-00:00:00"}}
