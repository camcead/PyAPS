# RVS template directory: taken from the templates_RVS key of your script_params file (the job scripts
# export it as PYAPS_RVS_TEMPLATES). When running aps_rvs.py by hand, export PYAPS_RVS_TEMPLATES or
# replace the value below with the real directory.
template_lib : '${PYAPS_RVS_TEMPLATES}'
min_vel: -1000 # minimum velocity to consider
max_vel: 1000 # maximum velocity to consider
min_vel_step: 0.2 # The smallest step for the final P(v|D) evaluation
vel_step0: 5 # The initial velocity grid resolution
min_vsini: 0.1  # min vsini to fit
max_vsini: 500 # max vsini to fit
second_minimizer: 1 # to use a second optimizer (gradient based after nelder mead)
