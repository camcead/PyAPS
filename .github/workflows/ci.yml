name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (base package + test tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Package imports and reports its version
        run: python -c "import PyAPS; print(PyAPS.__version__)"
      - name: Tests that need no WEAVE data
        run: pytest tests/test_internal_imports.py tests/test_aps_explorer_session.py tests/test_aps_explorer_auth.py tests/test_aps_utils_configdir.py -p no:cacheprovider

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Explorer image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pyaps-explorer .
