name: Release

# Push a tag such as v2.1 (or v2.0-rasti, a labelled snapshot of version 2.0) to publish a GitHub release with the built distributions.
# (A GitHub release is also what triggers the Zenodo DOI, once the repository is enabled there.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check the tag matches version.txt
        run: |
          v="v$(cat version.txt | tr -d '[:space:]')"
          case "$GITHUB_REF_NAME" in "$v"|"$v"-*) ;; *) echo "tag $GITHUB_REF_NAME is not $v or $v-<suffix> (version.txt)"; exit 1;; esac
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # only attaches the built files; the release notes you wrote in the GitHub form are left untouched
          generate_release_notes: false
